name: agendify
description: Agenda eletrônica cross-platform em Flutter e Dart.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # Estado e preferências
  provider: ^6.1.5
  shared_preferences: ^2.5.5

  # Calendário
  table_calendar: ^3.1.3

  # Internacionalização
  intl: ^0.19.0

  # Identificadores únicos
  uuid: ^4.6.0

  # ── Geolocalização (novo — Relatório 11/11) ──────────────────────────────
  # Suporte a mobile (Android/iOS) e web (Geolocation API do browser).
  geolocator: ^13.0.2
  # Geocodificação reversa (coordenadas → endereço legível).
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/agendify_logo.png
